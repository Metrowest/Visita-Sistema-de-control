<!-- =========================================================================
     INDEX.HTML - SECCIÓN 1: CONFIGURACIÓN Y ENCABEZADOS DE ESTRUCTURA BASE
     Ubicación del bloque: CUMBRE ABSOLUTA DEL DOCUMENTO HTML
     ========================================================================= -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control Modular - Superintendentes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <meta property="og:description" content="Con esta aplicacion puedes actualizar los registros para la visita.">
    <meta property="og:image" content="https://github.com/Metrowest/Visita-Sistema-de-control/blob/main/img/og-image.png?raw=true">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:url" content="https://github.com/Metrowest/Visita-Sistema-de-control/blob/main/img/og-image.png?raw=true">

     
</head>
<body>
    <div class="contenedor-principal">

        <!-- =========================================================================
             INDEX.HTML - SECCIÓN 1.1: PANEL SUPERIOR FIJO GESTOR DE CARPETAS (DRIVE)
             Ubicación del bloque: PRIMERA TARJETA FIJA CON ESTILOS PURIFICADOS
             ========================================================================= -->
        <div id="moduloGestorCarpetas" class="tarjeta-modulo">
            <div class="tarjeta-cabecera-drive">
                <div class="icono-titulo">📁</div>
                <h2>Panel Control: Archivos y Carpetas (Drive)</h2>
            </div>
            
            <div class="formulario-estilizado-drive">
                <!-- REQUERIMIENTO 1: Selector propio e independiente para las carpetas -->
                <div class="campo-formulario">
                    <label for="selectorSubcarpetas">📁 Navegación de Carpetas de "Visita Actual":</label>
                    <select id="selectorSubcarpetas" class="selector-estilizado">
                        <option value="RAIZ">Cargando raíz "Visita Actual"...</option>
                    </select>
                </div>

                <!-- ACCIONES DE CREAR Y BORRAR CARPETAS AUTÓNOMAS -->
                <div class="bloque-botones grid-botones-drive">
                    <button type="button" id="btnCrearCarpetaDrive" class="btn-primario">➕ Crear Carpeta</button>
                    <button type="button" id="btnBorrarCarpetaDrive" class="btn-secundario">🗑️ Borrar Activa</button>
                </div>

                <!-- REQUERIMIENTO 3: Medio físico responsivo para subir documentos -->
                <div class="campo-formulario contenedor-dropzone-drive">
                    <label for="archivoSubirDrive" class="etiqueta-upload-drive">
                        📤 Seleccionar Documento o Foto para Subir
                    </label>
                    <input type="file" id="archivoSubirDrive">
                    <div id="nombreArchivoSeleccionado" class="texto-archivo-seleccionado">Ningún archivo seleccionado</div>
                    
                    <div id="contenedorPrevisualizacionFoto" style="display: none;">
                        <img id="previewFotoDriveImg" src="" alt="Preview">
                    </div>
                         <button type="button" id="btnIniciarCargaDrive" class="btn-carga-blanco">🚀 Subir Documento Seleccionado</button>
                    </div>

                <!-- REQUERIMIENTO 2: Visor gráfico de archivos disponibles en la subcarpeta -->
                <div class="seccion-visor-archivos">
                    <h3>📄 Archivos Almacenados en esta Ubicación:</h3>
                    <div class="tabla-responsiva">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nombre del Archivo</th>
                                    <th>Tipo</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="tablaCuerpoDrive">
                                <tr><td colspan="3">Consultando archivos de Drive...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- =========================================================================
             INDEX.HTML - SECCIÓN 1.5: SELECTOR DE NAVEGACIÓN GENERAL (PÁGINAS)
             Ubicación del bloque: INTERSECCIÓN DE MENÚ DESPLEGABLE CENTRAL
             ========================================================================= -->
        <div class="tarjeta-modulo contenedor-selector">
            <label for="selectorHoja" class="etiqueta-seleccion">Selecciona una Sección</label>
            <select id="selectorHoja" class="selector-estilizado" onchange="cargarDatos()">
                <option value="Superintendentes">👥 Superintendentes (Horizontal)</option>
                <option value="Hospitalidad">🏨 Hospitalidad (Horizontal)</option>
                <option value="Estudios Día 1">📚 Estudios Día 1 (Vertical)</option>
                <option value="Estudios Día 2">📚 Estudios Día 2 (Vertical)</option>
                <option value="Estudios Día 3">📚 Estudios Día 3 (Vertical)</option>
                <option value="Pastoreo Día 1">🐑 Pastoreo Día 1 (Vertical)</option>
                <option value="Pastoreo Día 2">🐑 Pastoreo Día 2 (Vertical)</option>
                <option value="Pastoreo Día 3">🐑 Pastoreo Día 3 (Vertical)</option>
            </select>
        </div>
        <!-- =========================================================================
             INDEX.HTML - SECCIÓN 2: FORMULARIO DE CAPTURA VERTICAL CONSOLIDADO
             Ubicación del bloque: CENTRO (PARTE SUPERIOR)
             ========================================================================= -->
        <div class="tarjeta-modulo">
            <div class="tarjeta-cabecera">
                <div class="icono-titulo">📋</div>
                <h2 id="formTitulo">Añadir Registro</h2>
            </div>

            <form id="formularioSuperintendentes" class="formulario-estilizado">
                <div class="grid-formulario">
                    <div class="campo-formulario" id="contenedorCampo1">
                        <label id="lblCampo1" for="txtGrupo">Grupo / Día</label>
                        <input type="text" id="txtGrupo" name="grupo" placeholder="Ej. #89" required>
                    </div>

                    <div class="campo-formulario" id="contenedorCampo2">
                        <label id="lblCampo2" for="txtSuperintendente">Superintendente / Visitante</label>
                        <input type="text" id="txtSuperintendente" name="superintendente" placeholder="Nombre completo" required>
                    </div>

                    <div class="campo-formulario" id="contenedorCampo3">
                        <label id="lblCampo3" for="txtTelefono">Teléfono / Acompañante</label>
                        <input type="text" id="txtTelefono" name="telefono" placeholder="Información" required>
                    </div>

                    <!-- BLOQUES EXTRA DINÁMICOS DESPLEGABLES VERTICALES -->
                    <div class="campo-formulario" id="contenedorCampo4" style="display: none;">
                        <label id="lblCampo4" for="txtCampo4">Campo 4</label>
                        <input type="text" id="txtCampo4" name="campo4" placeholder="Información extra">
                    </div>

                    <div class="campo-formulario" id="contenedorCampo5" style="display: none;">
                        <label id="lblCampo5" for="txtCampo5">Campo 5</label>
                        <input type="text" id="txtCampo5" name="campo5" placeholder="Información extra">
                    </div>

                    <div class="campo-formulario" id="contenedorCampo6" style="display: none;">
                        <label id="lblCampo6" for="txtCampo6">Campo 6</label>
                        <input type="text" id="txtCampo6" name="campo6" placeholder="Información extra">
                    </div>

                    <div class="campo-formulario" id="contenedorCampo7" style="display: none;">
                        <label id="lblCampo7" for="txtCampo7">Campo 7</label>
                        <input type="text" id="txtCampo7" name="campo7" placeholder="Información extra">
                    </div>

                    <div class="campo-formulario" id="contenedorCampo8" style="display: none;">
                        <label id="lblCampo8" for="txtCampo8">Campo 8</label>
                        <input type="text" id="txtCampo8" name="campo8" placeholder="Información extra">
                    </div>
                </div>

                <div class="bloque-botones">
                    <button type="submit" id="btnGuardar" class="btn-primario">💾 Guardar Registro</button>
                    <button type="button" id="btnCancelar" class="btn-secundario" style="display: none;">❌ Cancelar Edición</button>
                </div>
            </form>
        </div>

        <!-- =========================================================================
             INDEX.HTML - SECCIÓN 3: REJILLA GRÁFICA DE REGISTROS CON ENCABEZADOS LIBRES
             Ubicación del bloque: CENTRO (PARTE INFERIOR DE LA PANTALLA)
             ========================================================================= -->
        <div class="tarjeta-modulo">
            <div class="tarjeta-cabecera">
                <div class="icono-titulo">📂</div>
                <h2>Registros Almacenados en la Hoja</h2>
            </div>

            <div class="tabla-responsiva">
                <table id="tablaRegistros">
                    <thead id="tablaCabecera"></thead>
                    <tbody id="tablaCuerpo">
                        <tr>
                            <td class="celda-carga">
                                <div class="spinner-carga"></div>
                                Cargando base de datos desde Google Sheets...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

<!-- =========================================================================
     INDEX.HTML - SECCIÓN 4: ENLACES LÓGICOS DE CIERRE Y MAQUINARIA JS
     Ubicación del bloque: FINAL ABSOLUTO DEL ARCHIVO INDEX.HTML
     ========================================================================= -->
    </div> <!-- Cierre de contenedor-principal -->

    <!-- MAQUINARIA DE ENLACE DE RED INDEPENDIENTE AISLADA -->
    <script src="app.js"></script>
    <script src="carpetas.js"></script>
</body>
</html>
