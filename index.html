<!-- =========================================================================
     INDEX.HTML - SECCIÓN 1: CONFIGURACIÓN Y CABECERA MODERNA
     Ubicación del bloque: ARRIBA DEL TODO
     ========================================================================= -->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control Modular - Superintendentes</title>

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <div class="contenedor-principal">

        <!-- =========================================================================
             INDEX.HTML - SECCIÓN 1.5: SELECTOR DE NAVEGACIÓN Y ENLACE INTERACTIVO
             Ubicación del bloque: JUSTO AQUÍ ENTRANDO AL CONTENEDOR PRINCIPAL
             ========================================================================= -->
        <div class="tarjeta-modulo contenedor-selector">
            <label for="selectorHoja" class="etiqueta-seleccion">Selecciona una Sección</label>

            <!-- Dentro de tu select en la Sección 1.5 de tu HTML añade la opción del Día 2 -->
            <select id="selectorHoja" class="selector-estilizado" onchange="cargarDatos()">
                <option value="Superintendentes">👥 Superintendentes (Horizontal)</option>
                <option value="Hospitalidad">🏨 Hospitalidad (Horizontal)</option>
                <option value="Estudios Día 1">📚 Estudios Día 1 (Vertical)</option>
                <option value="Estudios Día 2">📚 Estudios Día 2 (Vertical)</option> <!-- <-- PEGA ESTA OPCIÓN AQUÍ -->
                <option value="Estudios_Dia_3">📚 Estudios Día 3 (Vertical)</option>
                <option value="Pastoreo Día 1">🐑 Pastoreo Día 1 (Vertical)</option>
                <option value="Pastoreo Día 2">🐑 Pastoreo Día 2 (Vertical)</option>
                <option value="Pastoreo Día 3">🐑 Pastoreo Día 3 (Vertical)</option>
            </select>

            <div class="enlace-seccion-activa">
                Sección activa: <a href="https://google.com" target="_blank" id="enlaceDinamico" class="link-moderno">🏨
                    Hospitalidad</a>
            </div>
        </div>

        <!-- ABAJO DE ESTO CONTINÚA TU SECCIÓN 2 (LA TARJETA DEL FORMULARIO BLANCO) -->
        <!-- =========================================================================
     INDEX.HTML - <!-- =========================================================================
     INDEX.HTML - SECCIÓN 2: FORMULARIO DE CAPTURA VERTICAL CONSOLIDADO
     Ubicación del bloque: CENTRO (PARTE SUPERIOR)
     ========================================================================= -->
        <div class="tarjeta-modulo">
            <div class="tarjeta-cabecera">
                <div class="icono-titulo">📋</div>
                <h2 id="formTitulo">Añadir Registro</h2>
            </div>

<!-- =========================================================================
     INDEX.HTML - SECCIÓN 2: FORMULARIO DE CAPTURA CON LAS 8 CAJAS DE TEXTO
     Ubicación del bloque: CENTRO (PARTE SUPERIOR)
     ========================================================================= -->
            <form id="formularioSuperintendentes" class="formulario-estilizado">
                <!-- Selector oculto para la base de datos remota -->
                <input type="hidden" id="selectorHoja" value="Superintendentes">

                <!-- CONTENEDOR DE CAMPOS DINÁMICOS: Controlado por la Sección 8.2.3 de app.js -->
                <div class="grid-formulario">
                    
                    <!-- BLOQUE BASE: Campos de texto comunes (Campos 1, 2 y 3) -->
                    <div class="campo-formulario" id="contenedorCampo1">
                        <label id="lblCampo1" for="txtGrupo">Grupo / Día</label>
                        <input type="text" id="txtGrupo" name="grupo" placeholder="Ej. #89" required>
                    </div>

                    <div class="campo-formulario" id="contenedorCampo2">
                        <label id="lblCampo2" for="txtSuperintendente">Superintendente / Visitante</label>
                        <input type="text" id="txtSuperintendente" name="superintendente" placeholder="Nombre completo" required>
                    </div>

                    <div class="campo-formulario" id="contenedorCampo3">
                        <label id="lblCampo3" for="txtTelefono">Teléfono / Acompañante</label>
                        <input type="text" id="txtTelefono" name="telefono" placeholder="Información" required>
                    </div>

                    <!-- CORRECCIÓN CLAVE: Inyectamos físicamente los 5 bloques extra que hacían falta -->
                    <div class="campo-formulario" id="contenedorCampo4" style="display: none;">
                        <label id="lblCampo4" for="txtCampo4">Campo 4</label>
                        <input type="text" id="txtCampo4" name="campo4" placeholder="Información extra">
                    </div>

                    <div class="campo-formulario" id="contenedorCampo5" style="display: none;">
                        <label id="lblCampo5" for="txtCampo5">Campo 5</label>
                        <input type="text" id="txtCampo5" name="campo5" placeholder="Información extra">
                    </div>

                    <div class="campo-formulario" id="contenedorCampo6" style="display: none;">
                        <label id="lblCampo6" for="txtCampo6">Campo 6</label>
                        <input type="text" id="txtCampo6" name="campo6" placeholder="Información extra">
                    </div>

                    <div class="campo-formulario" id="contenedorCampo7" style="display: none;">
                        <label id="lblCampo7" for="txtCampo7">Campo 7</label>
                        <input type="text" id="txtCampo7" name="campo7" placeholder="Información extra">
                    </div>

                    <div class="campo-formulario" id="contenedorCampo8" style="display: none;">
                        <label id="lblCampo8" for="txtCampo8">Campo 8</label>
                        <input type="text" id="txtCampo8" name="campo8" placeholder="Información extra">
                    </div>
                </div>

                <div class="bloque-botones">
                    <button type="submit" id="btnGuardar" class="btn-primario">
                        <span class="icono-btn">💾</span> Guardar Registro
                    </button>
                    <button type="button" id="btnCancelar" class="btn-secundario" style="display: none;">
                        <span class="icono-btn">❌</span> Cancelar Edición
                    </button>
                </div>
            </form>
        </div>

        <!-- =========================================================================
     INDEX.HTML - SECCIÓN 3: REJILLA GRÁFICA DE REGISTROS CON ENCABEZADOS LIBRES
     Ubicación del bloque: CENTRO (PARTE INFERIOR DE LA PANTALLA)
     ========================================================================= -->
        <div class="tarjeta-modulo">
            <div class="tarjeta-cabecera">
                <div class="icono-titulo">📂</div>
                <h2>Registros Almacenados en la Hoja</h2>
            </div>

            <div class="tabla-responsiva">
                <table id="tablaRegistros">
                    <!-- CORRECCIÓN MAESTRA: Dejamos la cabecera 100% libre para que app.js inyecte 
                         los 3, 4 u 8 encabezados en tiempo real según la pestaña activa -->
                    <thead id="tablaCabecera"></thead>

                    <tbody id="tablaCuerpo">
                        <tr>
                            <td class="celda-carga">
                                <div class="spinner-carga"></div>
                                Cargando base de datos desde Google Sheets...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- =========================================================================
     INDEX.HTML - SECCIÓN 4: ENLACES LÓGICOS DE CIERRE
     Ubicación del bloque: ABAJO DEL TODO
     ========================================================================= -->
    </div> <!-- Cierre de contenedor-principal -->

    <!-- Inyección de la maquinaria JavaScript local -->
    <script src="app.js"></script>
</body>

</html>
